<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - Quizwe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>➕ Create New Quiz</h1></header>
    <div class="container">
        <div class="card">
            <form id="quiz-form">
                <div class="form-group">
                    <label>Quiz Title</label>
                    <input type="text" id="quiz-title" required placeholder="e.g. Math Grade 5">
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Grade</label>
                        <select id="quiz-grade" required>
                            <option value="">Select Grade</option>
                            <option>1-5</option>
                            <option>6-8</option>
                            <option>9-12</option>
                            <option>College</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Level</label>
                        <select id="quiz-level" required>
                            <option value="">Select Level</option>
                            <option>Easy</option>
                            <option>Medium</option>
                            <option>Hard</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Questions (JSON format)</label>
                    <textarea id="quiz-questions" rows="12" required placeholder='[
  {
    "question": "What is 2+2?",
    "options": ["3", "4", "5", "6"],
    "correct": "4"
  },
  {
    "question": "Capital of France?",
    "options": ["London", "Berlin", "Paris", "Madrid"],
    "correct": "Paris"
  }
]'>[
  {
    "question": "What is 2+2?",
    "options": ["3", "4", "5", "6"],
    "correct": "4"
  },
  {
    "question": "Capital of France?",
    "options": ["London", "Berlin", "Paris", "Madrid"],
    "correct": "Paris"
  }
]</textarea>
                    <small>Format: Array of objects with question, options array, and correct answer</small>
                </div>
                
                <button type="submit" class="btn">🚀 Create & Share Quiz</button>
                <button type="button" class="btn" onclick="window.location.href='dashboard.html'" style="background: #666;">← Back to Dashboard</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById('quiz-form').onsubmit = (e) => {
            e.preventDefault();
            createQuiz();
        };
    </script>
</body>
</html>
